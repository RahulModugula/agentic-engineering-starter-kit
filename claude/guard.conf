# Read by hooks/lane-guard.sh (plain shell). The coordinator's checkout is the only place merges may run;
# it follows MAIN_REPO in ~/.claude/lanes.zsh, so you only set your repo name once.
COORD_DIR="${WORK:-$HOME/work}/$(sed -n 's/^MAIN_REPO=\([^ #]*\).*/\1/p' "$HOME/.claude/lanes.zsh" 2>/dev/null)"
PROD_PROFILE=""        # optional: an AWS CLI profile whose writes should always ask first
