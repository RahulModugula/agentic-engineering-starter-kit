name: Bug report
description: Something in the kit did not work as documented.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting. Please remove any secrets or tokens from logs before pasting."
  - type: input
    id: version
    attributes:
      label: Kit version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: ["macOS", "Linux", "Windows (WSL)", "Other"]
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: ["Installer", "Guard hooks", "Merge queue / verifier", "Review tiers", "Secret scanner", "Ops helpers", "Docs"]
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. Run ./install.sh\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This is not a security vulnerability (those go to SECURITY.md).
          required: true
